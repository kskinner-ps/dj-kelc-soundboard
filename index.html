<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Days of AR Lives - DJ KELC</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* --- Body & Background --- */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      text-align: center;
      overflow-x: hidden;
      background: linear-gradient(180deg, #ff2b7a, #a223ff, #12003a);
      position: relative;
      min-height: 100vh;

      cursor: url('https://assets.codepen.io/721952/neon-crosshair.png') 16 16, crosshair;
    }

    .pad,
    button,
    a,
    .linkedin-pad {
      cursor: url('https://assets.codepen.io/721952/neon-crosshair.png') 16 16, crosshair !important;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.06) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.06) 41px);
      animation: gridShift 40s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 400px 400px, 400px 400px; }
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.6;
      pointer-events: none;
      animation: float 12s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) translateX(0); opacity: 0.6; }
      50% { opacity: 0.3; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }

    h1 {
      margin-top: 40px;
      font-size: 60px;
      font-family: 'Audiowide', sans-serif;
      text-shadow: 0 0 20px #ff61c0, 0 0 10px #ff61c0;
      position: relative;
      z-index: 1;
    }

    h3 {
      margin-top: -10px;
      font-size: 26px;
      font-family: 'Press Start 2P', sans-serif;
      color: #ff61c0;
      text-shadow: 0 0 10px #ff61c0;
      position: relative;
      z-index: 1;
    }

    .board {
      display: flex;
      flex-wrap: wrap;
      width: 840px;
      margin: 60px auto;
      gap: 25px;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .pad {
      width: 220px;
      height: 120px;
      border-radius: 20px;
      transition: 0.15s;
      position: relative;
    }

    .pad:hover {
      transform: scale(1.08);
      filter: brightness(1.3);
    }

    .blue    { background: #3a00ff; }
    .red     { background: #ff2b7a; }
    .yellow  { background: #ffea5b; color: #000; }
    .orange  { background: #ff7a29; }
    .purple  { background: #a223ff; }
    .green   { background: #3cffc1; color: #000; }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 15px rgba(255,255,255,0.2), 0 0 30px rgba(255,255,255,0.1);
      }
      50% {
        box-shadow: 0 0 30px rgba(255,255,255,0.6), 0 0 50px rgba(255,255,255,0.3);
      }
      100% {
        box-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 40px rgba(255,255,255,0.15);
      }
    }

    video {
      margin-top: 20px;
      width: 75%;
      max-width: 900px;
      border-radius: 15px;
      border: 4px solid #ff61c0;
      box-shadow: 0 0 30px #ff61c0;
      display: block;
      margin-left: auto;
      margin-right: auto;
      z-index: 1;
      position: relative;
    }
  </style>
</head>

<body>

<h1>The Days of AR Lives</h1>
<h3>Hosted by DJ KELC</h3>

<div class="board">
  <div class="pad blue" onclick="toggleSound('days')"></div>
  <div class="pad red" onclick="toggleSound('airhorn')"></div>
  <div class="pad yellow" onclick="toggleSound('cheer')"></div>
  <div class="pad orange" onclick="toggleSound('holiday')"></div>
  <div class="pad purple" onclick="toggleSound('trombone')"></div>
  <div class="pad green" onclick="toggleSound('grinch')"></div>
</div>

<!-- Audio Files -->
<audio id="days" src="days_of_ar_lives.mp3" preload="auto"></audio>
<audio id="airhorn" src="airhorn.mp3" preload="auto"></audio>
<audio id="cheer" src="cheering.mp3" preload="auto"></audio>
<audio id="holiday" src="holiday_inn.wav" preload="auto"></audio>
<audio id="trombone" src="sad_trombone.mp3" preload="auto"></audio>
<audio id="grinch" src="mr_grinch.wav" preload="auto"></audio>

<script>
  /* --- Toggle Play / Stop --- */
  function toggleSound(id) {
    const audio = document.getElementById(id);

    if (audio.paused) {
      audio.currentTime = 0;
      audio.play();
    } else {
      audio.pause();
      audio.currentTime = 0;
    }
  }

  /* --- Random pulse for pads --- */
  const pads = document.querySelectorAll('.pad');
  pads.forEach(pad => {
    function randomPulse() {
      const duration = 1.5 + Math.random() * 1.5;
      pad.style.animation = `pulse ${duration}s infinite alternate`;
    }
    randomPulse();
    setInterval(randomPulse, 3000);
  });

  /* --- Generate floating neon particles (20) --- */
  const colors = ['#ff2b7a','#a223ff','#3cffc1','#ffea5b','#ff7a29','#3a00ff'];
  for(let i=0; i<20; i++){
    const particle = document.createElement('div');
    particle.classList.add('particle');
    const size = Math.random()*6+2+'px';
    particle.style.width = size;
    particle.style.height = size;
    particle.style.background = colors[Math.floor(Math.random()*colors.length)];
    particle.style.left = Math.random()*100+'vw';
    particle.style.top = Math.random()*100+'vh';
    particle.style.animationDuration = (5 + Math.random()*10)+'s';
    document.body.appendChild(particle);
  }
</script>

</body>
</html>
